<div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-label="Search this site" hidden data-index="{{ '/search.json' | relative_url }}">
  <div class="search-backdrop" data-close></div>
  <div class="search-panel">
    <div class="search-field">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <input id="search-input" type="search" placeholder="Search essays, stories, code, blog, cv…" autocomplete="off" spellcheck="false" aria-controls="search-results" aria-describedby="search-help">
      <button type="button" class="search-esc mono" data-close aria-label="Close search">esc</button>
    </div>
    <ul id="search-results" class="search-results" role="listbox"></ul>
    <p id="search-help" class="search-help mono">↑ ↓ to move · enter to open · esc to close</p>
  </div>
</div>
