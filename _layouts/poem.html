---
layout: default
---
<article class="essay poem">
  <p class="essay-back"><a href="{{ '/stories/' | relative_url }}">&larr; poems &amp; stories</a></p>
  <h1 class="essay-title">{{ page.title }}</h1>
  <p class="essay-date">{{ page.kind | default: 'poem' }} · {{ page.date | date: '%B %Y' }}</p>
  <div class="essay-body{% if page.kind == 'poem' or page.kind == nil %} verse{% endif %}">
    {{ content }}
  </div>
</article>
