---
layout: default
---
<article class="post">
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    <p class="page-desc mono">{{ page.date | date: '%B %-d, %Y' }}{% if page.tags.size > 0 %} · {{ page.tags | join: ', ' }}{% endif %}</p>
  </header>
  <div class="page-body prose">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/writing/' | relative_url }}">&larr; all writing</a></p>
</article>
